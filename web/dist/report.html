<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nemesis Red-Team Report</title>
<meta name="description" content="Red-team report for a walking robot policy: what breaks it, why, by how much margin, and what was fixed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 18px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat b { display: block; font-size: 28px; font-weight: 800; }
  .stat span { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .finding { display: grid; grid-template-columns: minmax(240px, 420px) 1fr; gap: 16px; margin-bottom: 14px; }
  .finding video { width: 100%; border-radius: 10px; display: block; }
  .finding h3 { margin: 0 0 6px; font-size: 17px; }
  .sev { font: 600 11px "JetBrains Mono", monospace; padding: 2px 8px; border-radius: 99px; border: 1px solid; }
  .sev.open { color: var(--crimson); border-color: var(--crimson); }
  .sev.fixed { color: var(--cyan); border-color: var(--cyan); }
  .recs li { margin-bottom: 6px; }
  .headline { font-size: clamp(22px, 3.4vw, 32px); font-weight: 800; line-height: 1.2; margin: 6px 0 12px; }
  @media (max-width: 700px) { .finding { grid-template-columns: 1fr; } }
  @media print { body { background: white; color: black; } .card, .stat { background: white; } video { display: none !important; } }
</style>
</head>
<body>
<main>
  <header class="top">
    <a class="brand" href="/" style="color:inherit;text-decoration:none"><span class="dot"></span>NEMESIS</a>
    <div class="badge mono">RED-TEAM REPORT</div>
  </header>
  <div id="report"><p class="muted">Loading…</p></div>
</main>
<script type="module" src="js/report.js"></script>
</body>
</html>
